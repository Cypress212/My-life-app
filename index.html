<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Commander | Fluid Edition</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); 
            --text: #f8fafc; --accent: #3b82f6; --urgent: #ef4444;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text); margin: 0; padding: 20px;
            min-height: 100vh; transition: background 0.5s ease;
        }

        /* Glassmorphism Effect */
        .glass {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Fluid Brain Dump */
        .brain-dump { margin-bottom: 25px; border: 2px solid var(--accent); animation: slideIn 0.5s ease; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        /* Animated Items */
        .item { 
            background: rgba(255,255,255,0.05); 
            margin-bottom: 12px; padding: 15px; 
            border-radius: 12px; display: flex; 
            justify-content: space-between; align-items: center;
            animation: fadeIn 0.4s ease-out;
            transition: all 0.2s ease;
        }
        .item:hover { transform: translateX(5px); background: rgba(255,255,255,0.08); }

        /* Bouncy Buttons */
        button { 
            background: var(--accent); border: none; color: white; 
            padding: 12px; border-radius: 8px; cursor: pointer; 
            font-weight: 700; transition: transform 0.1s active, opacity 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        input, select, textarea { 
            width: 100%; background: rgba(0,0,0,0.2); 
            border: 1px solid #334155; color: white; 
            padding: 12px; margin-bottom: 10px; border-radius: 8px;
            outline: none; transition: border-color 0.3s;
        }
        input:focus { border-color: var(--accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .done { opacity: 0.4; text-decoration: line-through; }
    </style>
</head>
<body>

    <div class="glass brain-dump">
        <h3 style="margin:0; font-size:0.8rem; color:var(--accent);">🧠 DON'T FORGET:</h3>
        <input type="text" id="quickThought" style="border:none; background:transparent; font-size:1.4rem; padding:10px 0;" placeholder="Tap to type..." onkeypress="if(event.key==='Enter') saveThought()">
        <p id="currentThought" style="margin:5px 0 0 0; font-weight:600;"></p>
    </div>

    <div class="grid">
        <div class="glass">
            <h2>📅 Timeline</h2>
            <div style="display:flex; gap:10px;">
                <input type="time" id="timeInput" style="width:40%;">
                <input type="text" id="eventInput" placeholder="Event name">
            </div>
            <button onclick="addEvent()" style="width:100%;">Add to Schedule</button>
            <div id="scheduleList" style="margin-top:20px;"></div>
        </div>

        <div class="glass">
            <h2>✅ To-Do</h2>
            <select id="priorityInput">
                <option value="high">Urgent</option>
                <option value="med" selected>Standard</option>
                <option value="low">Later</option>
            </select>
            <input type="text" id="taskInput" placeholder="What's the task?">
            <button onclick="addTask()" style="width:100%;">Add Task</button>
            <div id="taskList" style="margin-top:20px;"></div>
        </div>

        <div class="glass">
            <h2>📝 Life Notes</h2>
            <textarea id="notesInput" rows="15" oninput="saveNotes()" placeholder="Weekly goals..."></textarea>
            <button onclick="clearAll()" style="background:var(--urgent); margin-top:10px;">Reset All</button>
        </div>
    </div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    window.onload = () => {
        renderSchedule();
        renderTasks();
        document.getElementById('currentThought').innerText = localStorage.getItem('thought') || "";
        document.getElementById('notesInput').value = localStorage.getItem('notes') || "";
        setInterval(checkReminders, 30000);
    };

    function playAlarm() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5 note
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
        osc.start(); osc.stop(ctx.currentTime + 1);
    }

    function saveThought() {
        const val = document.getElementById('quickThought').value;
        localStorage.setItem('thought', val);
        document.getElementById('currentThought').innerText = val;
        document.getElementById('quickThought').value = "";
    }

    function addTask() {
        const tasks = JSON.parse(localStorage.getItem('tasks') || "[]");
        tasks.push({ id: Date.now(), text: document.getElementById('taskInput').value, priority: document.getElementById('priorityInput').value, done: false });
        localStorage.setItem('tasks', JSON.stringify(tasks));
        document.getElementById('taskInput').value = "";
        renderTasks();
    }

    function addEvent() {
        const events = JSON.parse(localStorage.getItem('events') || "[]");
        events.push({ id: Date.now(), time: document.getElementById('timeInput').value, text: document.getElementById('eventInput').value, notified: false });
        localStorage.setItem('events', JSON.stringify(events));
        renderSchedule();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        const tasks = JSON.parse(localStorage.getItem('tasks') || "[]");
        list.innerHTML = tasks.sort((a,b) => (a.priority === 'high' ? -1 : 1)).map(t => `
            <div class="item ${t.done ? 'done' : ''}" style="border-left: 4px solid var(--${t.priority === 'high' ? 'urgent' : (t.priority === 'med' ? 'soon' : 'later')})">
                <span>${t.text}</span>
                <div style="display:flex; gap:5px;">
                    <button onclick="toggleTask(${t.id})" style="background:#475569; padding:5px 10px;">✓</button>
                    <button onclick="deleteItem('tasks', ${t.id})" style="background:var(--urgent); padding:5px 10px;">✕</button>
                </div>
            </div>
        `).join('');
    }

    function renderSchedule() {
        const list = document.getElementById('scheduleList');
        const events = JSON.parse(localStorage.getItem('events') || "[]");
        list.innerHTML = events.sort((a,b) => a.time.localeCompare(b.time)).map(e => `
            <div class="item">
                <span><strong>${e.time}</strong> ${e.text}</span>
                <button onclick="deleteItem('events', ${e.id})" style="background:var(--urgent); padding:5px 10px;">✕</button>
            </div>
        `).join('');
    }

    function checkReminders() {
        const now = new Date();
        const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        let events = JSON.parse(localStorage.getItem('events') || "[]");
        events.forEach(e => {
            if (e.time === time && !e.notified) {
                playAlarm();
                alert("⏰ TIME FOR: " + e.text);
                e.notified = true;
            }
        });
        localStorage.setItem('events', JSON.stringify(events));
    }

    function saveNotes() { localStorage.setItem('notes', document.getElementById('notesInput').value); }
    function toggleTask(id) { 
        let t = JSON.parse(localStorage.getItem('tasks')); 
        t = t.map(x => x.id === id ? {...x, done: !x.done} : x);
        localStorage.setItem('tasks', JSON.stringify(t)); renderTasks(); 
    }
    function deleteItem(k, id) { 
        let i = JSON.parse(localStorage.getItem(k)).filter(x => x.id !== id);
        localStorage.setItem(k, JSON.stringify(i)); k === 'tasks' ? renderTasks() : renderSchedule();
    }
    function clearAll() { if(confirm("Start fresh?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
